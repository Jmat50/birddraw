<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>birddraw</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box}
  body{font-family:sans-serif;background:#eee;margin:0;padding:12px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:center}
  .bar{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px;width:100%;max-width:min(100%,520px)}
  .bar label{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:2px 2px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .bar input[type=checkbox]{width:18px;height:18px;margin:0;flex-shrink:0}
  button{font:inherit;padding:8px 12px;min-height:40px;border:1px solid #999;border-radius:4px;background:#f7f7f7;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:#ddd}
  #seed{flex:1 1 160px;min-width:0;width:auto;max-width:100%;padding:8px 10px;font-size:16px;border:1px solid #999;border-radius:4px}
  /* fit bird in remaining viewport: width capped by height so alive canvas is not huge */
  #out,#cv{width:min(100%,520px,calc((100dvh - 14rem) * 480 / 440));max-width:100%}
  #out svg,#cv{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);width:100%;height:auto;max-height:calc(100dvh - 14rem);display:block;touch-action:manipulation}
  #info{font-size:12px;color:#666;margin-top:8px;max-width:520px;width:100%;text-align:center;padding:0 4px;word-break:break-word}
  #intensity{width:100px;max-width:40vw;accent-color:#333}
  #dur{width:52px;padding:6px 4px;font-size:16px;border:1px solid #999;border-radius:4px}
  #moves{row-gap:2px}
  @media (max-width:520px){
    body{padding:10px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    .bar{gap:6px 8px;justify-content:flex-start;font-size:15px}
    .bar.primary{flex-wrap:wrap}
    .bar.primary #seed{flex:1 1 100%}
    .bar.primary button{flex:1 1 auto}
    button{padding:10px 12px;min-height:44px}
    .bar label{min-height:44px;padding:4px 6px;margin:-4px -2px}
    #intensity{flex:1;width:auto;min-width:80px}
  }
</style>
</head>
<body>
<div class="bar primary">
  <input id="seed" placeholder="seed (any text)" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="draw">draw</button>
  <button id="rand">random</button>
</div>
<div class="bar">
  <label><input id="alive" type="checkbox" checked> alive</label>
  <label><input id="drawon" type="checkbox"> draw-on</label>
  <label title="play each new bird's call once when it is drawn; when alive, loop it in sync with the animation"><input id="song" type="checkbox" autocomplete="off"> birdsong</label>
  <button id="replay" style="display:none">replay</button>
  <label>intensity <input id="intensity" type="range" min="0" max="1" step="0.05" value="0.7"></label>
  <label>loop <input id="dur" type="number" min="2" max="20" step="1" value="6" inputmode="numeric"> s</label>
  <label title="render with exact hidden-line clipping (what a plotter would draw)"><input id="exact" type="checkbox"> exact</label>
</div>
<div class="bar" id="moves">
  movements:
  <label><input type="checkbox" data-move="breath" checked> breathing</label>
  <label><input type="checkbox" data-move="head" checked> head</label>
  <label><input type="checkbox" data-move="blink" checked> blinking</label>
  <label><input type="checkbox" data-move="tail" checked> tail</label>
  <label><input type="checkbox" data-move="crest" checked> crest</label>
  <label><input type="checkbox" data-move="wing"> wing flicks</label>
  <label><input type="checkbox" data-move="flap"> wing flaps</label>
  <label><input type="checkbox" data-move="sing"> singing</label>
</div>
<div class="bar">
  <button id="svg">download svg</button>
  <button id="wav" title="the call (the whole loop when alive with birdsong)">download wav</button>
  <button id="flip">download animated svg</button>
  <button id="gif">download gif</button>
</div>
<div id="out"></div>
<canvas id="cv" style="display:none"></canvas>
<div id="info"></div>
<script src="birddraw.js"></script>
<script>
let $ = id => document.getElementById(id);
let current = null;
let live = null;
let raf = 0;
let actx = null, asrc = null;
let vcur = null, once = null;

function fname(ext){
  return current.seed.replace(/[^A-Za-z0-9]+/g, '_') + ext;
}
function download(blob, name){
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function render(seed){
  let t0 = performance.now();
  let polylines = main(seed);
  let ms = Math.round(performance.now() - t0);
  current = {seed, svg: draw_svg(polylines)};
  $('out').innerHTML = $('drawon').checked ? draw_svg_anim(polylines, 0.005) : current.svg;
  $('seed').value = seed;
  $('info').textContent = `${polylines.length} polylines, ${ms} ms`;
  location.hash = encodeURIComponent(seed);
  live = null;
  update_alive();
  // when alive, update_alive already started the loop
  if ($('song').checked && !$('alive').checked){
    audio_ctx();
    setTimeout(play_song, 0);
  }
}

function audio_ctx(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state == 'suspended') actx.resume();
  return actx;
}
// the call alone (no animation rig), for the drawn seed and loop length
function get_voice(){
  let T = Number($('dur').value) || 6;
  if (!vcur || vcur.seed != current.seed || vcur.T != T) vcur = voice(current.seed, {duration: T});
  return vcur;
}
function stop_song(){
  if (!once) return;
  once.onended = null;
  once.stop();
  once.disconnect();
  once = null;
}
// plays the bird's utterances once
function play_song(){
  if (!current) return;
  let v = get_voice(), c = audio_ctx();
  if (!v.buf || v.buf.sampleRate != c.sampleRate){
    let pcm = v.clip(c.sampleRate);
    v.buf = c.createBuffer(1, pcm.length, c.sampleRate);
    v.buf.copyToChannel(pcm, 0);
  }
  stop_song();
  once = c.createBufferSource();
  once.buffer = v.buf;
  once.connect(c.destination);
  once.onended = () => { once = null; };
  once.start();
  let s = v.song;
  $('info').textContent = $('info').textContent.replace(/; voice .*$/, '') +
    `; voice ${s.an} ${(s.F/1000).toFixed(1)} kHz, ${v.buf.duration.toFixed(1)} s`;
}

function build_live(){
  let t0 = performance.now();
  let moves = {};
  document.querySelectorAll('#moves input').forEach(c => moves[c.dataset.move] = c.checked);
  live = animator(current.seed, {duration: Number($('dur').value) || 6, intensity: Number($('intensity').value), moves});
  live.t0 = performance.now();
  let ap = live.ap, tl = live.timeline, mv = tl.moves, parts = [];
  if (mv.breath) parts.push(`breathing ${(ap.breath_f*60).toFixed(0)}/min`);
  if (mv.head) parts.push(`${tl.segs.length} head moves (${ap.style})`);
  if (mv.blink) parts.push(`${tl.blinks.length} blinks`);
  if (mv.tail) parts.push(`tail ${ap.tail_style}`);
  if (mv.wing) parts.push(`${tl.flicks.length} wing flick bouts`);
  if (tl.flap) parts.push(`flap: ${tl.flap.nb} beats at ${tl.flap.fb.toFixed(1)} Hz from ${tl.flap.t0.toFixed(1)} s`);
  if (mv.sing || $('song').checked){
    let s = tl.song;
    parts.push(`voice ${s.an} ${(s.F/1000).toFixed(1)} kHz, ${s.utts.length} utterance${s.utts.length > 1 ? 's' : ''}`);
  }
  $('info').textContent = `alive: ${live.arg.archetype}, rig ${Math.round(performance.now()-t0)} ms; ` +
    (parts.join(', ') || 'no movement');
}

function draw_frame(now){
  let cv = $('cv');
  let dpr = window.devicePixelRatio || 1;
  let W = FRAME_W + 20, H = FRAME_H + 20;
  let cssw = cv.clientWidth || W;
  let k = cssw / W * dpr;
  if (cv.width != Math.round(W*k)){ cv.width = Math.round(W*k); cv.height = Math.round(H*k); }
  let ctx = cv.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = 'floralwhite';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeRect(10, 10, FRAME_W, FRAME_H);
  ctx.translate(10, 10);
  // with birdsong on, the audio clock drives the picture so the beak stays in sync
  let t = asrc && actx.state == 'running' ? actx.currentTime - live.a0 - (actx.outputLatency || 0) : (now - live.t0) / 1000;
  t = ((t % live.T) + live.T) % live.T;
  let path = ls => {
    let p = new Path2D();
    for (let l of ls){
      p.moveTo(l[0][0], l[0][1]);
      for (let j = 1; j < l.length; j++) p.lineTo(l[j][0], l[j][1]);
    }
    return p;
  };
  if ($('exact').checked){
    ctx.stroke(path(live.frame(t)));
  }else{
    for (let op of live.ops(t)){
      if (op.fill){
        ctx.fillStyle = 'floralwhite';
        for (let poly of op.fill){
          let p = path([poly]);
          p.closePath();
          ctx.fill(p);
        }
      }else{
        ctx.stroke(path(op.stroke));
      }
    }
  }
  raf = requestAnimationFrame(draw_frame);
}

function stop_audio(){
  if (!asrc) return;
  // keep the animation's phase when it falls back to the wall clock
  if (live && actx.state == 'running') live.t0 = performance.now() - (actx.currentTime - live.a0 - (actx.outputLatency || 0))*1000;
  asrc.stop();
  asrc.disconnect();
  asrc = null;
}
// the loop is rendered once per bird at the device rate and looped sample-exactly
function play_audio(){
  stop_audio();
  if (!$('song').checked || !live) return;
  stop_song();
  audio_ctx();
  if (!live.abuf){
    let pcm = live.audio(actx.sampleRate);
    live.abuf = actx.createBuffer(1, pcm.length, actx.sampleRate);
    live.abuf.copyToChannel(pcm, 0);
  }
  asrc = actx.createBufferSource();
  asrc.buffer = live.abuf;
  asrc.loop = true;
  asrc.connect(actx.destination);
  live.a0 = actx.currentTime + 0.05;
  asrc.start(live.a0);
}

function update_alive(){
  cancelAnimationFrame(raf);
  let on = $('alive').checked && current;
  $('cv').style.display = on ? 'block' : 'none';
  $('out').style.display = on ? 'none' : 'block';
  if (!on){ stop_audio(); return; }
  if (!live) build_live();
  play_audio();
  raf = requestAnimationFrame(draw_frame);
}

function random_seed(){
  return seed_name(String(Math.random()));
}
$('draw').onclick = () => render($('seed').value || random_seed());
$('rand').onclick = () => render(random_seed());
$('seed').onkeydown = e => { if (e.key == 'Enter') $('draw').onclick(); };
$('drawon').onchange = () => render(current.seed);
// birdsong in alive mode also opens the beak
function want_sing(){
  let sing = document.querySelector('#moves [data-move=sing]');
  if ($('song').checked && $('alive').checked && !sing.checked){ sing.checked = true; live = null; }
}
$('alive').onchange = () => { want_sing(); update_alive(); };
$('intensity').onchange = () => { live = null; update_alive(); };
$('dur').onchange = () => { live = null; update_alive(); };
document.querySelectorAll('#moves input').forEach(c => c.onchange = () => { live = null; update_alive(); });
// audio needs a click to start (autoplay policy): once per new bird, or looped with the animation when alive
$('song').onchange = () => {
  let on = $('song').checked;
  $('replay').style.display = on ? '' : 'none';
  if (!on){ stop_song(); stop_audio(); return; }
  if ($('alive').checked){ want_sing(); update_alive(); }
  else play_song();
};
$('replay').onclick = () => $('alive').checked ? play_audio() : play_song();
$('wav').onclick = () => {
  if (!current) return;
  let loop = $('song').checked && $('alive').checked && live;
  let pcm = loop ? live.audio(44100) : get_voice().clip(44100);
  download(new Blob([wav_encode(pcm, 44100)], {type: 'audio/wav'}), fname(loop ? '_alive.wav' : '_song.wav'));
};
$('svg').onclick = () => { if (current) download(new Blob([current.svg], {type: 'image/svg+xml'}), fname('.svg')); };
$('flip').onclick = () => {
  if (!current) return;
  if (!live) build_live();
  download(new Blob([draw_svg_flipbook(live.frames(12), live.T)], {type: 'image/svg+xml'}), fname('_alive.svg'));
};
$('gif').onclick = () => {
  if (!current) return;
  if (!live) build_live();
  download(new Blob([anim_gif(live, 20, 1)], {type: 'image/gif'}), fname('_alive.gif'));
};
render(location.hash ? decodeURIComponent(location.hash.slice(1)) : random_seed());
</script>
</body>
</html>
